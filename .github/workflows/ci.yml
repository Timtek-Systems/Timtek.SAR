name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Timtek.SAR.slnx

      - name: Build
        run: dotnet build Timtek.SAR.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Timtek.SAR.Tests/Timtek.SAR.Tests.csproj --no-build --configuration Release --verbosity normal
